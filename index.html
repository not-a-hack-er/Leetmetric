<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeetMetric</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!--heading
        user
        stats-->
        <h1>LeetMetric</h1>
        <div class="user-container">
            <p>enter your username below</p>
            <div class="user-input-container">
                <input type="text" placeholder="enter your LeetCode Username" id="user-input">
                <button id="search-btn">Search</button>
            </div>

        </div>

        <div class="stats-container">
            <div class="progress">
                <div class="progress-item">
                    <div class="easy-progress circle">
                        <span id="easy-label"></span>
                    </div>
                    <p>Easy</p>
                </div>

                <div class="progress-item">
                    <div class="medium-progress circle">
                        <span id="medium-label"></span>
                    </div>
                    <p>Medium</p>
                </div>

                <div class="progress-item">
                    <div class="hard-progress circle">
                        <span id="hard-label"></span>
                    </div>
                    <p>Hard</p>
                </div>
            </div>

            <div class="stats-card">
                <!--directly populate from js-->
            </div>
        </div>
    <script src="script.js"></script>
</body>
</html>
